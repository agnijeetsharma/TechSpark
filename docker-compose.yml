services:

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: my-backend

    ports:
      - "3000:3000"

    env_file:
      - ./Backend/.env

    volumes:
      - ./Backend:/src
      - backend_node_modules:/src/node_modules


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: my-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules


  mongo:
    image: mongo:8

    container_name: my-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db


volumes:
  backend_node_modules:
  frontend_node_modules:
  mongo_data: